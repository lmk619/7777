<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>管理后台 · 出师吧 Prentice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231d1d1f'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='700' text-anchor='middle' fill='%23fff' font-family='-apple-system,Helvetica,Arial,sans-serif'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    body { background: var(--bg2); }
    .adm-top { position: sticky; top: 0; z-index: 10; background: rgba(251,251,253,.86); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line2); }
    .adm-top .in { max-width: 1240px; margin: 0 auto; padding: 12px 22px; display: flex; align-items: center; gap: 14px; }
    .adm-wrap { max-width: 1240px; margin: 0 auto; padding: 26px 22px 70px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
    .kpi { background: #fff; border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); }
    .kpi b { display: block; font-size: 28px; letter-spacing: -.02em; margin-top: 4px; }
    .kpi span { color: var(--text2); font-size: 13px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .bar .field { margin: 0; }
    .bar .input { padding: 8px 12px; font-size: 14px; }
    table.adm { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.adm th, table.adm td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
    table.adm th { color: var(--text2); font-weight: 600; background: var(--bg3); position: sticky; top: 0; }
    table.adm td.num, table.adm th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .scroll { overflow: auto; max-height: 560px; border-radius: 12px; border: 1px solid var(--line2); background: #fff; }
    .chart { width: 100%; height: 220px; display: block; }
    .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text2); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .hidden { display: none !important; }
    .uidbox { font-family: var(--mono); background: var(--bg2); padding: 10px 12px; border-radius: 10px; word-break: break-all; user-select: all; }
  </style>
</head>
<body>
  <header class="adm-top"><div class="in"><span class="logo-stack"><b>出师吧</b><i>PRENTICE</i></span><span class="chip dark">管理后台</span><span class="spacer"></span><span class="faint small" id="who"></span><button class="btn sm hidden" id="logout">退出</button></div></header>
  <main class="adm-wrap" id="root"><div class="boot"><span class="boot-dot"></span>正在连接云端…</div></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/assets/config.js"></script>
  <script src="/assets/cloudbase-lite.js"></script>
  <script src="/assets/cloud.js"></script>
  <script src="/assets/admin.js"></script>
</body>
</html>
